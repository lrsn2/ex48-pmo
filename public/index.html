<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tarefas</title>
</head>
<body>
  <h1>Lista de Tarefas</h1>
  <form id="form">
    <input id="titulo" placeholder="Nova tarefa" required>
    <button type="submit">Adicionar</button>
  </form>
  <ul id="lista"></ul>
  <p id="erro" style="color:red"></p>

  <script>
    const api = 'http://localhost:3000/api/tarefas';
    const form = document.getElementById('form');
    const inputTitulo = document.getElementById('titulo');
    const lista = document.getElementById('lista');
    const erroEl = document.getElementById('erro');

    function limparErro() {
      erroEl.textContent = '';
    }

    function exibirErro(mensagem) {
      erroEl.textContent = mensagem;
    }

    // Ao carregar a página, busca as tarefas com fetch e exibe na lista
    async function carregarTarefas() {
      limparErro();
      try {
        const res = await fetch(api);
        if (!res.ok) throw new Error(`Erro ao buscar tarefas (${res.status})`);
        
        const tarefas = await res.json();
        lista.innerHTML = '';
        
        tarefas.forEach(tarefa => {
          const li = document.createElement('li');
          li.textContent = tarefa.titulo;
          lista.appendChild(li);
        });
      } catch (err) {
        exibirErro(`Erro de rede/API: ${err.message}`);
      }
    }

    // Ao submeter o formulário, envia POST com { titulo } e atualiza a lista
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      limparErro();

      const titulo = inputTitulo.value.trim();
      if (!titulo) return;

      try {
        const res = await fetch(api, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ titulo })
        });

        if (!res.ok) throw new Error(`Erro ao adicionar tarefa (${res.status})`);

        inputTitulo.value = '';
        await carregarTarefas();
      } catch (err) {
        exibirErro(`Erro de rede/API: ${err.message}`);
      }
    });

    carregarTarefas();
  </script>
</body>
</html>
